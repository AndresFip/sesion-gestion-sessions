<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<head>
    <meta charset="UTF-8">
    <title>Crear Sesiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1 class="mb-4">Creador de Sesiones</h1>

<form th:action="@{/panel/crear}" method="post" class="row g-3">

    <div class="col-md-2">
        <label class="form-label">Tipo de sesión</label>
        <select class="form-select" name="tipoSesion">
            <option th:each="tipo : ${tipoSesion}"
                    th:value="${tipo}"
                    th:text="${tipo}"></option>
        </select>
    </div>

    <div class="col-md-3">
        <label class="form-label">#Ticket</label>
        <input type="text" name="ticket" class="form-control" required>
    </div>

    <div class="col-md-4">
        <label class="form-label">Fecha inicio</label>
        <input type="datetime-local" name="fechaInicio" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Fecha fin</label>
        <input type="datetime-local" name="fechaFin" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Ingeniero principal</label>
        <select name="ingenieroId" class="form-select" required>
            <option th:each="ing : ${ingenieros}" th:value="${ing.id}" th:text="${ing.nombre}"></option>
        </select>
    </div>
    <div class="col-md-6">
        <label class="form-label">Técnico</label>
        <input type="text" name="tecnicoNombre" class="form-control" placeholder="Opcional">
    </div>
    <div class="col-md-6">
        <label class="form-label">Observaciones</label>
        <textarea name="observaciones" class="form-control" placeholder="Opcional"></textarea>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-success">Crear sesión</button>
        <a href="/panel" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

</body>
</html>
