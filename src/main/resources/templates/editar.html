<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1 class="mb-4">Editar Sesión #<span th:text="${sesion.id}"></span></h1>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/panel/editar/{id}(id=${sesion.id})}" method="post" class="row g-3">

    <div class="col-md-2">
        <label class="form-label">Tipo de sesión</label>
        <select class="form-select" name="tipoSesion">
            <option th:each="tipo : ${tiposSesion}"
                    th:value="${tipo}"
                    th:text="${tipo}"
                    th:selected="${sesion.tipoSesion == tipo}"
            ></option>
        </select>
    </div>

    <div class="col-md-3">
        <label class="form-label">#Ticket</label>
        <input type="text" name="ticket" class="form-control" th:value="${sesion.ticket}" required>
    </div>

    <div class="col-md-4" th:if="${session.rolAcceso.name() != 'INGENIERO'}">
        <label class="form-label">Fecha inicio</label>
        <input type="datetime-local" name="fechaInicio" class="form-control"
               th:value="${sesion.fechaInicio}" required>
    </div>

    <div class="col-md-4" th:if="${session.rolAcceso.name() != 'INGENIERO'}">
        <label class="form-label">Fecha fin</label>
        <input type="datetime-local" name="fechaFin" class="form-control"
               th:value="${sesion.fechaFin}" required>
    </div>

    <div class="col-md-4" th:if="${session.rolAcceso.name() != 'INGENIERO'}">
        <label class="form-label">Ingeniero Principal</label>
        <select name="ingenieroId" class="form-select" required>
            <option th:each="ing : ${ingenieros}"
                    th:value="${ing.id}"
                    th:text="${ing.nombre}"
                    th:selected="${ing.id == sesion.ingeniero.id}"></option>
        </select>
    </div>

    <div class="col-md-3">
        <label class="form-label">Técnico</label>
        <input type="text" name="tecnicoNombre" class="form-control" th:value="${sesion.tecnicoNombre}">
    </div>

    <div class="col-md-3" th:if="${session.rolAcceso.name() != 'INGENIERO'}">
        <label class="form-label">Ing. Responsable</label>
        <select name="ingenieroResponsable" class="form-select">
            <option value="">-- Seleccionar --</option>
            <option th:each="ing : ${ingenieros}"
                    th:value="${ing.nombre}"
                    th:text="${ing.nombre}"
                    th:selected="${ing.nombre == sesion.ingenieroResponsable}"></option>
        </select>
    </div>

    <div class="col-8">
        <label class="form-label">Observaciones</label>
        <textarea name="observaciones" class="form-control" th:text="${sesion.observaciones}"></textarea>
    </div>

    <!-- Campos ocultos: cuando el rol es INGENIERO, estos valores viajan sin ser editables -->
    <input type="hidden" th:if="${session.rolAcceso.name() == 'INGENIERO'}" name="fechaInicio" th:value="${sesion.fechaInicio}">
    <input type="hidden" th:if="${session.rolAcceso.name() == 'INGENIERO'}" name="fechaFin" th:value="${sesion.fechaFin}">
    <input type="hidden" th:if="${session.rolAcceso.name() == 'INGENIERO'}" name="ingenieroId" th:value="${sesion.ingeniero.id}">
    <input type="hidden" th:if="${session.rolAcceso.name() == 'INGENIERO'}" name="ingenieroResponsable" th:value="${sesion.ingenieroResponsable}">

    <div class="col-12">
        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="/panel" class="btn btn-secondary">Cancelar</a>
    </div>

</form>

</body>
</html>
