<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html xmlns:th="http://www.thymeleaf.org">
        <head>
        <meta charset="UTF-8">
        <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1 class="mb-4">Gestión de Usuarios</h1>
<a href="/panel" class="btn btn-secondary mb-3">Volver al panel</a>

<table class="table table-bordered table-striped">
    <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo</th>
        <th>Rol de acceso</th>
    </tr>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.nombre}"></td>
        <td th:text="${usuario.apellido}"></td>
        <td th:text="${usuario.correo}"></td>
        <td>
            <form th:action="@{/panel/usuarios/actualizar-rol/{id}(id=${usuario.id})}" method="post" class="d-flex gap-2">
                <select name="rolAcceso" class="form-select form-select-sm">
                    <option th:each="rol : ${roles}"
                            th:value="${rol}"
                            th:text="${rol}"
                            th:selected="${rol == usuario.rolAcceso}"></option>
                </select>
                <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
            </form>
        </td>
        <td>
            <form th:action="@{/panel/usuarios/eliminar/{id}(id=${usuario.id})}" method="post"
                  onsubmit="return confirm('¿Seguro que quieres eliminar este usuario?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html></title>
</head>
<body>

</body>
</html>
